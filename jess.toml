manifest_version = 1

[package]
id = "org.dreamweave.tes3cmd"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/commands.luau", "tests/style.luau"]

# tes3 is what a plugin is. tes3-saves checks an OpenMW save's own structure, which is what
# `validate` does under the omwsave profile.
[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3-saves" = "0.1"

[modules]
"@tes3cmd" = "src/init.luau"
"@tes3cmd/commands" = "src/commands.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. @tes3cmd works on plugins in memory. @tes3cmd/commands is each
# command as a function of a request to a result: it reads the plugins a request names and their
# masters, and writes the edited plugin and its backup, so its caller needs filesystem.read and,
# for a command that writes, filesystem.write.

[[layer]]
id = "tes3cmd.core"
requires = ["tes3.core", "tes3-saves.core"]
exports = ["@tes3cmd", "@tes3cmd/commands"]
