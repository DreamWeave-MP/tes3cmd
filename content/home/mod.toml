# tes3cmd as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `tes3cmd-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "9efafc2e-98f1-4d72-87c7-fb3da5b435f3"
slug = "tes3cmd"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.tes3cmd"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
